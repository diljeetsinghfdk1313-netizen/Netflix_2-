<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d12">
  <meta name="description" content="अपनी चुनी हुई फ़िल्म के लिए आख़िरी कदम।">
  <title>फ़िल्म के लिए आख़िरी कदम — सिनेमा सफ़र</title>
  <style>
    :root{color-scheme:dark;--bg:#100d12;--panel:#1b1720;--text:#f7f0e7;--muted:#b8acba;--gold:#f0bd71;--line:rgba(240,189,113,.22)}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;color:var(--text);background:radial-gradient(ellipse at 50% 10%,rgba(119,60,91,.2),transparent 34rem),var(--bg);font:16px/1.7 system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}
    a{color:inherit}.shell{width:min(100% - 32px,1000px);margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
    .brand{color:var(--gold);font-weight:850;letter-spacing:.08em;text-decoration:none}.back{color:var(--muted);font-size:14px;text-decoration:none}
    .hero{display:grid;grid-template-columns:minmax(150px,225px) 1fr;align-items:center;gap:clamp(20px,5vw,46px);margin:28px 0;padding:clamp(20px,4vw,34px);border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,#302435,#19151d)}
    .poster{display:grid;place-items:center;aspect-ratio:.70;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#463247,#17131b 72%)}
    .poster img{width:100%;height:100%;object-fit:cover}.poster-fallback{padding:14px;color:var(--gold);font-size:24px;font-weight:850;line-height:1.2;text-align:center}
    .eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.14em}.hero h1{margin:9px 0;font-size:clamp(30px,5vw,48px);line-height:1.25}.hero p{margin:8px 0;color:var(--muted)}
    .copy-card{margin:28px 0;padding:23px;border-left:3px solid var(--gold);border-radius:0 16px 16px 0;background:var(--panel)}
    .copy-card h2{margin:0 0 4px;font-size:clamp(23px,4vw,33px)}.copy-card p{margin:0;color:var(--muted)}
    .bottom-gate{margin:48px 0 36px;padding:clamp(25px,5vw,46px);border:1px solid #f0bd715e;border-radius:23px;background:linear-gradient(145deg,#29212d,#19151d);text-align:center}
    .bottom-gate h2{margin:0;color:var(--gold);font-size:clamp(29px,5.5vw,47px);line-height:1.33}.bottom-gate p{max-width:670px;margin:10px auto;color:var(--muted)}
    .timer{display:grid;place-items:center;width:98px;height:98px;margin:20px auto 12px;border:4px solid var(--gold);border-radius:50%;color:var(--gold);background:#f0bd7112;font-size:40px;font-weight:850;line-height:1}
    .timer-note{color:var(--muted);font-size:14px}.telegram-link{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:18px;padding:10px 19px;border-radius:999px;color:#21170f;background:linear-gradient(110deg,#f4cf8d,#e9a85d);font-weight:800;text-decoration:none}
    .error{margin:30px 0;padding:28px;border:1px solid #d9828759;border-radius:18px;background:#4b222b40;text-align:center}.error p{color:var(--muted)}
    footer{padding:20px 0 34px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;text-align:center}[hidden]{display:none!important}
    @media(max-width:620px){.topbar{align-items:flex-start;flex-direction:column}.hero{grid-template-columns:1fr}.poster{width:min(100%,220px);margin:auto}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><a class="brand" href="index.html">सिनेमा सफ़र</a><a class="back" href="movies.html">सभी फ़िल्में</a></header>

      <section class="copy-card"><h2>फ़िल्म पाने के लिए आख़िरी बार नीचे तक स्क्रॉल करें</h2><p>नीचे पहुँचने पर 5 सेकंड इंतज़ार करें।</p></section>

    
    <main id="wait-content" hidden>
      <section class="hero">
        <div class="poster" id="wait-poster"></div>
        <div><div class="eyebrow">फ़िल्म</div><h1 id="wait-title"></h1><p id="wait-release"></p></div>
      </section>

    

      <section class="copy-card" id="overview-card"><p id="wait-overview"></p></section>


      <section class="bottom-gate" id="wait-bottom">
        <h2>5 सेकंड इंतज़ार करें</h2>
        <p id="timer-message">नीचे पहुँचने पर टाइमर शुरू होगा।</p>
        <div class="timer" role="timer" aria-live="polite"><span id="timer-number">5</span></div>
        <div class="timer-note">फिर Telegram खुलेगा।</div>
        <a class="telegram-link" id="telegram-fallback" href="#" hidden>Telegram खोलें</a>
      </section>
    </main>
    <section class="error" id="error-content" hidden><h1 id="error-title">फ़िल्म नहीं मिली</h1><p id="error-message">सूची पर वापस जाएँ।</p><a class="telegram-link" href="movies.html">फ़िल्मों की सूची</a></section>
    <footer>सिनेमा सफ़र</footer>
  </div>
  <script src="movies.js"></script>
  <script>
    (() => {
      const id = new URLSearchParams(location.search).get("id");
      const movie = window.MovieTools.find(id);
      const content = document.getElementById("wait-content");
      const error = document.getElementById("error-content");
      if (!movie) { error.hidden = false; return; }
      content.hidden = false;
      document.getElementById("wait-title").textContent = movie.title;
      document.getElementById("wait-release").textContent = window.MovieTools.dateLabel(movie.releaseDate);
      document.getElementById("wait-overview").textContent = movie.overview || "";
      if (!movie.overview) document.getElementById("overview-card").hidden = true;

      const poster = document.getElementById("wait-poster");
      const posterSource = window.MovieTools.posterSource(movie);
      if (posterSource) {
        const image = document.createElement("img");
        image.src = posterSource;
        image.alt = movie.title + " पोस्टर";
        image.onerror = () => { image.remove(); poster.classList.add("poster-fallback"); poster.textContent = movie.title; };
        poster.append(image);
      } else {
        poster.classList.add("poster-fallback");
        poster.textContent = movie.title;
      }

      const fallback = document.getElementById("telegram-fallback");
      const message = document.getElementById("timer-message");
      const number = document.getElementById("timer-number");
      if (!window.MovieTools.telegramLinkIsValid(movie.telegramUrl)) {
        message.textContent = "Telegram लिंक movies.js में जोड़ें।";
        number.textContent = "—";
        return;
      }
      fallback.href = movie.telegramUrl;
      fallback.hidden = false;

      let started = false, remaining = 5;
      function startTimer() {
        if (started) return;
        started = true;
        message.textContent = "5 सेकंड इंतज़ार करें।";
        const interval = setInterval(() => {
          remaining = Math.max(0, remaining - 1);
          number.textContent = String(remaining);
          if (!remaining) {
            clearInterval(interval);
            message.textContent = "Telegram खुल रहा है।";
            setTimeout(() => location.assign(movie.telegramUrl), 350);
          }
        }, 1000);
      }
      const checkBottom = () => {
        if (innerHeight + scrollY >= document.documentElement.scrollHeight - 2) {
          startTimer();
          removeEventListener("scroll", checkBottom);
        }
      };
      addEventListener("scroll", checkBottom, { passive: true });
    })();
  </script>
</body>
</html>
