<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d12">
  <meta name="description" content="फ़िल्म पाने के लिए नीचे स्क्रॉल करें।">
  <title>स्वागत है — सिनेमा सफ़र</title>
  <style>
    :root{color-scheme:dark;--bg:#100d12;--panel:#1b1720;--text:#f7f0e7;--muted:#b8acba;--gold:#f0bd71;--line:rgba(240,189,113,.22)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}
    body{margin:0;color:var(--text);background:radial-gradient(ellipse at 85% 8%,rgba(119,60,91,.23),transparent 34rem),radial-gradient(ellipse at 8% 48%,rgba(190,120,59,.1),transparent 32rem),var(--bg);font:16px/1.7 system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}
    a{color:inherit}.shell{width:min(100% - 32px,1040px);margin:auto}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:21px 0;border-bottom:1px solid var(--line)}
    .brand{color:var(--gold);font-weight:850;letter-spacing:.08em;text-decoration:none}
    .hero{position:relative;display:flex;min-height:65vh;flex-direction:column;justify-content:center;overflow:hidden;margin:34px 0 48px;padding:clamp(34px,7vw,78px) clamp(22px,7vw,76px);border:1px solid var(--line);border-radius:28px;background:linear-gradient(115deg,rgba(34,25,37,.98),rgba(24,19,27,.94));box-shadow:0 28px 80px #0004}
    .hero:after{position:absolute;top:-90px;right:-60px;width:300px;height:300px;border:1px solid #f0bd712e;border-radius:50%;box-shadow:0 0 0 28px #f0bd7109,0 0 0 58px #f0bd7106;content:"";pointer-events:none}
    h1{max-width:780px;margin:17px 0;font-size:clamp(39px,8vw,76px);line-height:1.22;letter-spacing:-.04em}h1 span{color:var(--gold)}
    .hero-copy{max-width:650px;color:var(--muted);font-size:clamp(17px,2.4vw,21px)}
    .bottom-gate{margin:68px 0 48px;padding:clamp(24px,5vw,46px);border:1px solid #f0bd715e;border-radius:24px;background:linear-gradient(145deg,#29212d,#19151d);text-align:center;box-shadow:0 25px 70px #0004}
    .bottom-gate h2{margin:0;color:var(--gold);font-size:clamp(28px,5vw,43px);line-height:1.35}.bottom-gate p{max-width:610px;margin:12px auto;color:var(--muted)}
    .timer{display:grid;place-items:center;width:92px;height:92px;margin:20px auto 12px;border:4px solid var(--gold);border-radius:50%;color:var(--gold);background:#f0bd7112;font-size:37px;font-weight:850;line-height:1}
    .timer-note{color:var(--muted);font-size:14px}.fallback{display:none;margin-top:14px;color:var(--gold);font-weight:700}
    footer{padding:20px 0 34px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;text-align:center}
    @media(max-width:620px){.topbar{align-items:flex-start;flex-direction:column}.hero{border-radius:20px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><a class="brand" href="index.html">सिनेमा सफ़र</a></header>
    <main>
      <section class="hero">
        <h1>वेबसाइट में आपका<br><span>स्वागत है</span></h1>
        <p class="hero-copy">फ़िल्म पाने के लिए नीचे तक स्क्रॉल करें।</p>
      </section>

      <section class="bottom-gate" id="welcome-bottom">
        <h2>10 सेकंड इंतज़ार करें</h2>
        <p id="welcome-message">नीचे पहुँचने पर टाइमर शुरू होगा।</p>
        <div class="timer" role="timer" aria-live="polite"><span id="welcome-number">10</span></div>
        <div class="timer-note">फिर फ़िल्मों की सूची खुलेगी।</div>
        <a class="fallback" id="welcome-fallback" href="continue.html">आगे जाएँ</a>
      </section>
    </main>
    <footer>सिनेमा सफ़र</footer>
  </div>
  <script>
    (() => {
      const number = document.getElementById("welcome-number");
      const message = document.getElementById("welcome-message");
      const fallback = document.getElementById("welcome-fallback");
      let started = false, remaining = 10;
      function startTimer() {
        if (started) return;
        started = true;
        message.textContent = "10 सेकंड इंतज़ार करें।";
        const interval = setInterval(() => {
          remaining = Math.max(0, remaining - 1);
          number.textContent = String(remaining);
          if (!remaining) {
            clearInterval(interval);
            message.textContent = "सूची खुल रही है।";
            fallback.style.display = "inline-block";
            setTimeout(() => location.assign("continue.html"), 350);
          }
        }, 1000);
      }
      const checkBottom = () => {
        if (innerHeight + scrollY >= document.documentElement.scrollHeight - 2) {
          startTimer();
          removeEventListener("scroll", checkBottom);
        }
      };
      addEventListener("scroll", checkBottom, { passive: true });
    })();
  </script>
</body>
</html>
