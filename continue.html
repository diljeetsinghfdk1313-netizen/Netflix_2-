<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d12">
  <meta name="description" content="फ़िल्मों की सूची तैयार हो रही है।">
  <title>5 सेकंड इंतज़ार करें — सिनेमा सफ़र</title>
  <style>
    :root{color-scheme:dark;--bg:#100d12;--text:#f7f0e7;--muted:#b8acba;--gold:#f0bd71;--line:rgba(240,189,113,.24)}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;color:var(--text);background:radial-gradient(ellipse at 50% 30%,rgba(119,60,91,.2),transparent 36rem),var(--bg);font:16px/1.7 system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}
    a{color:inherit}.shell{width:min(100% - 32px,960px);margin:auto}header{padding:20px 0;border-bottom:1px solid var(--line)}
    .brand{color:var(--gold);font-weight:850;letter-spacing:.08em;text-decoration:none}main{padding:20px 0 40px}
    .wait-card{margin:28px 0;padding:clamp(26px,7vw,58px) 20px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,#29212d,#19151d);box-shadow:0 25px 70px #0004;text-align:center}
    .eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.14em}h1{margin:12px 0;font-size:clamp(31px,6vw,52px);line-height:1.28}
    .lead{max-width:650px;margin:0 auto;color:var(--muted);font-size:clamp(17px,2.5vw,20px)}
    .timer{display:grid;place-items:center;width:104px;height:104px;margin:23px auto 12px;border:4px solid var(--gold);border-radius:50%;color:var(--gold);background:#f0bd7112;font-size:43px;font-weight:850;line-height:1}
    .timer-note{color:var(--muted);font-size:14px}.fallback{display:inline-flex;margin-top:17px;padding:11px 18px;border:1px solid var(--gold);border-radius:999px;color:var(--gold);font-weight:750;text-decoration:none}
    footer{padding:18px 0;color:var(--muted);font-size:13px;text-align:center}
  </style>
</head>
<body>
  <div class="shell">
    <header><a class="brand" href="index.html">सिनेमा सफ़र</a></header>
    <main>

      <section class="wait-card">
        <h1>कुछ न दबाएँ।<br>फ़िल्में लोड हो रही हैं।</h1>
        <p class="lead" id="wait-message">5 सेकंड इंतज़ार करें।</p>
        <div class="timer" role="timer" aria-live="polite"><span id="wait-number">5</span></div>
        <div class="timer-note">फिर फ़िल्में खुलेंगी।</div>
        <a class="fallback" href="movies.html">आगे जाएँ</a>
      </section>

    </main>
    <footer>सिनेमा सफ़र</footer>
  </div>
  <script>
    (() => {
      let remaining = 5;
      const number = document.getElementById("wait-number");
      const message = document.getElementById("wait-message");
      const interval = setInterval(() => {
        remaining = Math.max(0, remaining - 1);
        number.textContent = String(remaining);
        if (!remaining) {
          clearInterval(interval);
          message.textContent = "फ़िल्में खुल रही हैं।";
          setTimeout(() => location.assign("movies.html"), 350);
        }
      }, 1000);
    })();
  </script>
</body>
</html>
