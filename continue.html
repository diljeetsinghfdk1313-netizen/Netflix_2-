<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d12">
  <meta name="description" content="फ़िल्मों की सूची तैयार हो रही है।">
  <title>फ़िल्में लोड हो रही हैं — सिनेमा सफ़र</title>
  <style>
    :root{color-scheme:dark;--bg:#100d12;--text:#f7f0e7;--muted:#b8acba;--gold:#f0bd71;--line:rgba(240,189,113,.24)}
    *{box-sizing:border-box}body{min-height:100vh;min-height:100svh;margin:0;color:var(--text);background:radial-gradient(ellipse at 50% 30%,rgba(119,60,91,.16),transparent 36rem),var(--bg);font:15px/1.45 system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}
    a{color:inherit}.shell{width:min(100% - 20px,560px);min-height:100vh;min-height:100svh;margin:auto;display:flex;flex-direction:column}header{padding:8px 0;border-bottom:1px solid var(--line)}
    .brand{color:var(--gold);font-weight:750;letter-spacing:.04em;text-decoration:none}main{flex:1;display:grid;align-content:center;padding:5px 0}
    .wait-card{padding:12px 8px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#211b24,#171319);box-shadow:0 12px 36px #0003;text-align:center}
    h1{margin:0 0 4px;font-size:clamp(23px,5.5vw,30px);line-height:1.18;font-weight:700}
    .lead{margin:0 auto;color:var(--muted);font-size:14px}
    .loader{position:relative;display:grid;place-items:center;width:54px;height:54px;margin:5px auto 3px}
    .loader svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
    .loader-track,.loader-progress{fill:none;stroke-width:5}
    .loader-track{stroke:#ffffff20}
    .loader-progress{stroke:var(--gold);stroke-linecap:round;stroke-dasharray:283;stroke-dashoffset:283;animation:load-progress 6s linear forwards}
    .loader-core{width:8px;height:8px;border-radius:50%;background:var(--gold)}
    .timer-note{margin-bottom:3px;color:var(--muted);font-size:12px}
    .ads{display:grid;gap:3px;width:min(320px,100%);margin:0 auto}
    .ad-label{margin:1px 0 3px;color:#918895;font-size:10px;line-height:1.2;letter-spacing:.08em;text-transform:uppercase}
    .ad-slot{display:grid;place-items:center;width:min(320px,100%);height:50px;margin:auto;overflow:hidden;border:1px solid #ffffff14;border-radius:4px;background:#0d0b0f}
    .ad-slot iframe{max-width:100%;height:50px;border:0}
    .fallback{display:inline-flex;margin-top:5px;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
    @keyframes load-progress{to{stroke-dashoffset:0}}
    @media(max-height:620px){header{padding:5px 0}.wait-card{padding:8px 6px}.loader{width:42px;height:42px;margin:3px auto 2px}.timer-note{margin-bottom:2px}.ads{gap:2px}.fallback{margin-top:3px}footer{padding:3px 0}}
    @media(max-width:350px){.shell{width:calc(100% - 12px)}.wait-card{padding-right:4px;padding-left:4px}}
    @media(prefers-reduced-motion:reduce){.loader-progress{animation-duration:6s}}
    footer{padding:5px 0;color:var(--muted);font-size:11px;text-align:center}
  </style>
</head>

    <main>

        </div>
        <div class="timer-note">फ़िल्में तैयार की जा रही हैं…</div>
        <div class="ad-label">विज्ञापन</div>
        <div class="ads" aria-label="विज्ञापन">

  </div>

</html>
