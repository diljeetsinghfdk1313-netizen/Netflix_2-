<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d12">
  <meta name="description" content="फ़िल्म चुनें।">
  <title>फ़िल्मों की सूची — सिनेमा सफ़र</title>
  <style>
    :root{color-scheme:dark;--bg:#100d12;--panel:#1b1720;--text:#f7f0e7;--muted:#b8acba;--gold:#f0bd71;--line:rgba(240,189,113,.2)}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;color:var(--text);background:radial-gradient(ellipse at 90% 5%,rgba(119,60,91,.18),transparent 34rem),var(--bg);font:16px/1.7 system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}
    a{color:inherit}.shell{width:min(100% - 32px,1120px);margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}
    .brand{color:var(--gold);font-weight:850;letter-spacing:.08em;text-decoration:none}
    .intro{padding:46px 0 22px}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.14em}
    h1{margin:8px 0 6px;font-size:clamp(34px,6vw,58px);line-height:1.25}.intro p{margin:0;color:var(--muted)}
    .toolbar{display:flex;align-items:center;gap:14px;margin:18px 0 26px}.search{width:min(100%,520px);min-height:48px;padding:11px 16px;border:1px solid #ffffff1f;border-radius:14px;outline:none;color:var(--text);background:var(--panel);font:inherit}
    .search:focus{border-color:var(--gold);box-shadow:0 0 0 3px #f0bd711f}.result-count{color:var(--muted);font-size:13px;white-space:nowrap}
    .movie-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;padding-bottom:56px}
    .movie-card{display:block;overflow:hidden;border:1px solid #ffffff14;border-radius:17px;background:var(--panel);text-decoration:none;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
    .movie-card:hover{transform:translateY(-4px);border-color:#f0bd718c;box-shadow:0 18px 42px #0004}
    .poster{display:grid;place-items:center;aspect-ratio:.70;overflow:hidden;background:linear-gradient(145deg,#463247,#17131b 72%)}
    .poster img{width:100%;height:100%;object-fit:cover}.poster-fallback{padding:18px;color:var(--gold);font-size:clamp(21px,2.8vw,34px);font-weight:850;line-height:1.25;text-align:center}
    .card-copy{padding:14px 15px 17px}.card-copy h2{margin:0;font-size:17px;line-height:1.45}.card-date{margin-top:6px;color:var(--muted);font-size:13px}
    .empty{grid-column:1/-1;padding:42px 24px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);background:#1b17208c;text-align:center}
    .empty strong{display:block;margin-bottom:5px;color:var(--text);font-size:20px}.empty code{color:var(--gold)}
    footer{padding:20px 0 34px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;text-align:center}
    @media(max-width:900px){.movie-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:650px){.topbar{align-items:flex-start;flex-direction:column}.toolbar{align-items:flex-start;flex-direction:column}.movie-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card-copy{padding:11px}}
    @media(max-width:360px){.movie-grid{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><a class="brand" href="index.html">सिनेमा सफ़र</a></header>
    <main>
      <section class="intro"><div class="eyebrow">नई फ़िल्में पहले</div><h1>फ़िल्म चुनें</h1></section>
      <div class="toolbar"><input class="search" id="movie-search" type="search" autocomplete="off" placeholder="फ़िल्म खोजें" aria-label="फ़िल्म खोजें"><span class="result-count" id="result-count" aria-live="polite"></span></div>
      <section class="movie-grid" id="movie-grid" aria-label="फ़िल्मों की सूची"></section>
    </main>
    <footer>सिनेमा सफ़र</footer>
  </div>
  <script src="movies.js"></script>
  <script>
    (() => {
      const grid = document.getElementById("movie-grid");
      const search = document.getElementById("movie-search");
      const count = document.getElementById("result-count");
      const movies = window.MovieTools.sorted();

      function posterExists(movie) {
        return new Promise(resolve => {
          const source = window.MovieTools.posterSource(movie);

          if (!source) {
            resolve(false);
            return;
          }

          const img = new Image();
          img.onload = () => resolve(true);
          img.onerror = () => resolve(false);
          img.src = source;
        });
      }

      function makeCard(movie) {
        const card = document.createElement("a");
        card.className = "movie-card";
        card.href = "movie.html?id=" + encodeURIComponent(movie.id);
        card.setAttribute("aria-label", movie.title + " की जानकारी खोलें");

        const poster = document.createElement("div");
        poster.className = "poster";

        const img = document.createElement("img");
        img.src = window.MovieTools.posterSource(movie);
        img.alt = movie.title + " पोस्टर";
        img.loading = "lazy";
        poster.append(img);

        const copy = document.createElement("div");
        copy.className = "card-copy";

        const title = document.createElement("h2");
        title.textContent = movie.title;

        const date = document.createElement("div");
        date.className = "card-date";
        date.textContent = window.MovieTools.dateLabel(movie.releaseDate);

        copy.append(title, date);
        card.append(poster, copy);

        return card;
      }

      async function render() {
        const query = search.value.trim().toLocaleLowerCase("hi");

        const matches = movies.filter(movie =>
          [movie.title, movie.language, movie.genre, movie.overview]
            .join(" ")
            .toLocaleLowerCase("hi")
            .includes(query)
        );

        grid.replaceChildren();
        count.textContent = "";

        if (!matches.length) {
          const empty = document.createElement("div");
          empty.className = "empty";

          const title = document.createElement("strong");
          title.textContent = movies.length
            ? "फ़िल्म नहीं मिली"
            : "अभी फ़िल्में नहीं हैं";

          const note = document.createElement("span");
          note.textContent = movies.length
            ? "दूसरा नाम खोजें।"
            : "फ़िल्में movies.js में जोड़ें।";

          empty.append(title, note);
          grid.append(empty);
          return;
        }

        const checked = await Promise.all(
          matches.map(async movie => ({
            movie,
            exists: await posterExists(movie)
          }))
        );

        const moviesWithPosters = checked
          .filter(item => item.exists)
          .map(item => item.movie);

        count.textContent = moviesWithPosters.length
          ? moviesWithPosters.length + " फ़िल्में"
          : "";

        if (!moviesWithPosters.length) {
          const empty = document.createElement("div");
          empty.className = "empty";

          const title = document.createElement("strong");
          title.textContent = "पोस्टर नहीं मिले";

          const note = document.createElement("span");
          note.textContent = "इन फ़िल्मों की poster files उपलब्ध नहीं हैं।";

          empty.append(title, note);
          grid.append(empty);
          return;
        }

        const fragment = document.createDocumentFragment();

        moviesWithPosters.forEach(movie => {
          fragment.append(makeCard(movie));
        });

        grid.append(fragment);
      }

      search.addEventListener("input", render);
      render();
    })();
  </script>
</body>
</html>
