  <script>
    (() => {
      const movie = window.MovieTools.find(new URLSearchParams(location.search).get("id"));
      const content = document.getElementById("movie-content");
      const error = document.getElementById("error-content");
      if (!movie) { error.hidden = false; return; }
      content.hidden = false;
      document.getElementById("movie-title").textContent = movie.title;
      document.getElementById("movie-overview").textContent = movie.overview || "इस फ़िल्म की जानकारी जल्द जोड़ी जाएगी।";

      const poster = document.getElementById("movie-poster");
      const posterSource = window.MovieTools.posterSource(movie);
      if (posterSource) {
        const img = document.createElement("img");
        img.src = posterSource;
        img.alt = movie.title + " पोस्टर";
        img.onerror = () => { img.remove(); poster.classList.add("poster-fallback"); poster.textContent = movie.title; };
        poster.append(img);
      } else {
        poster.classList.add("poster-fallback");
        poster.textContent = movie.title;
      }

      const chips = document.getElementById("movie-chips");
      [window.MovieTools.dateLabel(movie.releaseDate), movie.language, movie.genre].filter(Boolean).forEach(value => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = value;
        chips.append(chip);
      });

      const nextUrl = "movie-wait.html?id=" + encodeURIComponent(movie.id);
      const continueLink = document.getElementById("continue-link");
      continueLink.href = nextUrl;
      const status = document.getElementById("bottom-status");
      let redirected = false;
      function goNext() {
        if (redirected) return;
        redirected = true;
        status.textContent = "अगला पन्ना खुल रहा है।";
        setTimeout(() => location.assign(nextUrl), 350);
      }
      const checkBottom = () => {
        if (innerHeight + scrollY >= document.documentElement.scrollHeight - 2) {
          goNext();
          removeEventListener("scroll", checkBottom);
        }
      };
      addEventListener("scroll", checkBottom, { passive: true });
    })();
  </script><script src="https://pl31716389.profitableratecpmnetwork.com/c1/50/61/c15061a4a49f9a8a1f3a26d779f14976.js"></script>
